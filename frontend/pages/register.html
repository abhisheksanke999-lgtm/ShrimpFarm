<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AquaControl System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body class="bg-main"
  style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div class="card shadow-md border-0 rounded-4 p-4" style="max-width: 440px; width: 100%; background: #ffffff;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3"
        style="width: 60px; height: 60px; font-size: 28px;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h3 class="fw-bold text-primary mb-1">Create Farmer Account</h3>
      <!--<p class="text-muted small mb-0">Enter your name, email, and a password</p> -->
    </div>

    <div id="errorAlert" class="alert alert-danger py-2 small rounded-3 mb-3 d-none"></div>
    <div id="jsRegErrorAlert" class="alert alert-warning py-2 small rounded-3 mb-3 d-none"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Full Name<span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-regular fa-user"></i></span>
          <input type="text" class="form-control" id="regName" placeholder="e.g. John Doe" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Email Address<span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-regular fa-envelope"></i></span>
          <input type="text" class="form-control" id="regEmail" placeholder="e.g. farmer@example.com" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Password<span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="regPass" placeholder="Create password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-semibold mb-3">
        <i class="fa-solid fa-user-plus me-2"></i>Create Account
      </button>
    </form>

    <div class="text-center small text-muted mt-2">
      Already have an account? <a href="../index.html" class="fw-bold text-primary">Sign In</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    (async () => {
      try {
        await API.get("/api/auth/me");
        window.location.href = pageUrl("dashboard.html");
      } catch (_) { }
    })();

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const full_name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPass").value;
      const jsAlert = document.getElementById("jsRegErrorAlert");
      const errorAlert = document.getElementById("errorAlert");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      hideAlert(jsAlert);
      hideAlert(errorAlert);

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!full_name) return showAlert(jsAlert, "Please enter your full name.", "warning");
      if (!email || !emailRegex.test(email)) return showAlert(jsAlert, "Please enter a valid email address.", "warning");
      if (!password || password.length < 4) return showAlert(jsAlert, "Password must be at least 4 characters.", "warning");

      submitBtn.disabled = true;
      const originalLabel = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';

      try {
        const data = await API.post("/api/auth/register", { full_name, email, password });
        const q = new URLSearchParams({
          email,
          expires_in: String(data?.expires_in || 90),
        });
        window.location.href = pageUrl(`verify-otp.html?${q.toString()}`);
      } catch (err) {
        showAlert(errorAlert, err.message || "Registration failed. Please try again.", "danger");
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalLabel;
      }
    });
  </script>
</body>

</html>
