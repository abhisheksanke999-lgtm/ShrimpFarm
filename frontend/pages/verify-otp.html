<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - AquaControl System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body class="bg-main"
  style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div class="card shadow-md border-0 rounded-4 p-4" style="max-width: 440px; width: 100%; background: #ffffff;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3"
        style="width: 60px; height: 60px; font-size: 28px;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h3 class="fw-bold text-primary mb-1">Verify your email</h3>
      <p class="text-muted small mb-0">Enter the 6-digit code sent to <span id="emailLabel" class="fw-semibold text-dark"></span></p>
    </div>

    <div id="errorAlert" class="alert alert-danger py-2 small rounded-3 mb-3 d-none"></div>
    <div id="successAlert" class="alert alert-success py-2 small rounded-3 mb-3 d-none"></div>
    <div id="jsErrorAlert" class="alert alert-warning py-2 small rounded-3 mb-3 d-none"></div>

    <form id="otpForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">Verification code<span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-key"></i></span>
          <input type="text" class="form-control" id="otpCode" inputmode="numeric" autocomplete="one-time-code"
            maxlength="6" placeholder="6-digit code" required>
        </div>
        <div class="form-text">Check inbox and spam. Code expires in <span id="expiryHint">5</span> minutes.</div>
      </div>
      <button type="submit" id="verifyBtn" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mb-3">
        <i class="fa-solid fa-check me-2"></i>Verify &amp; Continue
      </button>
    </form>

    <div class="text-center small text-muted">
      Didn't get the code?
      <button type="button" id="resendBtn" class="btn btn-link btn-sm p-0 fw-bold text-primary align-baseline">Resend OTP</button>
    </div>
    <div class="text-center small text-muted mt-2">
      <a href="register.html" class="fw-bold text-primary">Back to register</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const email = (params.get("email") || "").trim().toLowerCase();
    const expiresIn = Number(params.get("expires_in") || 300);
    document.getElementById("emailLabel").textContent = email || "your email";
    document.getElementById("expiryHint").textContent = String(Math.max(1, Math.round(expiresIn / 60)));

    if (!email) {
      showAlert(document.getElementById("jsErrorAlert"), "Missing email. Please register again.", "warning");
    }

    (async () => {
      try {
        await API.get("/api/auth/me");
        window.location.href = pageUrl("dashboard.html");
      } catch (_) { }
    })();

    document.getElementById("otpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const otp_code = document.getElementById("otpCode").value.trim();
      const jsAlert = document.getElementById("jsErrorAlert");
      const errorAlert = document.getElementById("errorAlert");
      const successAlert = document.getElementById("successAlert");
      const verifyBtn = document.getElementById("verifyBtn");
      hideAlert(jsAlert);
      hideAlert(errorAlert);
      hideAlert(successAlert);

      if (!email) return showAlert(jsAlert, "Missing email. Please register again.", "warning");
      if (!/^\d{4,12}$/.test(otp_code)) return showAlert(jsAlert, "Enter the verification code from your email.", "warning");

      verifyBtn.disabled = true;
      const originalLabel = verifyBtn.innerHTML;
      verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';

      try {
        await API.post("/api/auth/verify-otp", { email, otp_code });
        window.location.href = pageUrl("dashboard.html");
      } catch (err) {
        showAlert(errorAlert, err.message || "Verification failed.", "danger");
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = originalLabel;
      }
    });

    document.getElementById("resendBtn").addEventListener("click", async () => {
      const jsAlert = document.getElementById("jsErrorAlert");
      const errorAlert = document.getElementById("errorAlert");
      const successAlert = document.getElementById("successAlert");
      const resendBtn = document.getElementById("resendBtn");
      hideAlert(jsAlert);
      hideAlert(errorAlert);
      hideAlert(successAlert);

      if (!email) return showAlert(jsAlert, "Missing email. Please register again.", "warning");

      resendBtn.disabled = true;
      try {
        const data = await API.post("/api/auth/resend-otp", { email });
        if (data?.expires_in) {
          document.getElementById("expiryHint").textContent = String(
            Math.max(1, Math.round(Number(data.expires_in) / 60))
          );
        }
        showAlert(successAlert, data?.message || "A new code was sent. Check inbox and spam.", "success");
      } catch (err) {
        showAlert(errorAlert, err.message || "Could not resend code.", "danger");
      } finally {
        resendBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
