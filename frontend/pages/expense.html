<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;
      const data = await API.get("/api/expenses");
      const rows = data.items.length
        ? data.items.map((e) => `
            <tr>
              <td>${escapeHtml(e.expense_date)}</td>
              <td>${escapeHtml(e.category)}</td>
              <td>${escapeHtml(e.description)}</td>
              <td>Rs.${Number(e.amount).toFixed(2)}</td>
            </tr>`).join("")
        : `<tr><td colspan="4" class="text-center text-muted py-3">No expenses yet.</td></tr>`;

      mountAppShell("expense", `
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-1">Expense Records</h4>
            <p class="text-muted small mb-0">Track money spent on the farm</p>
          </div>
          <span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-2">
            Total: Rs.${Number(data.total_amount).toFixed(2)}
          </span>
        </div>
        <div class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Add Expense</h6>
              <form id="expenseForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Date<span class="text-danger">*</span></label>
                  <input type="date" name="expense_date" class="form-control" value="${todayISO()}" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Category<span class="text-danger">*</span></label>
                  <select name="category" class="form-select" required>
                    <option>Feed</option><option>Electricity</option><option>Medicine</option>
                    <option>Labor</option><option>Equipment</option><option>Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Description<span class="text-danger">*</span></label>
                  <input type="text" name="description" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Amount (Rs.)<span class="text-danger">*</span></label>
                  <input type="number" step="0.01" name="amount" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100 rounded-3" type="submit">Save Expense</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3">All Expenses</h6>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                  <thead class="table-light"><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById("expenseForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.post("/api/expenses", {
            expense_date: fd.get("expense_date"),
            category: fd.get("category"),
            description: fd.get("description"),
            amount: Number(fd.get("amount")),
          });
          await loadPage({ type: "success", msg: res.message });
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>

</html>
