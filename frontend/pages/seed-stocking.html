<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Stocking - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    // Easy to modify later
    const PL_STAGES = ["PL8", "PL10", "PL12", "PL15", "PL20"];
    const PAGE_SIZE = 8;

    let allItems = [];
    let ponds = [];
    let stats = { total_records: 0, total_pl: 0, total_cost: 0, most_recent_date: null };
    let searchQuery = "";
    let sortDir = "desc";
    let page = 1;
    let editingId = null;

    function money(n) {
      return `Rs.${Number(n || 0).toFixed(2)}`;
    }

    function costPer1000(cost, qty) {
      const q = Number(qty);
      const c = Number(cost);
      if (!q || q <= 0 || !c || c <= 0) return 0;
      return (c / q) * 1000;
    }

    function filteredItems() {
      const q = searchQuery.trim().toLowerCase();
      let rows = [...allItems];
      if (q) {
        rows = rows.filter((r) =>
          [r.pond_name, r.pl_stage, r.supplier_name, r.batch_number, r.stocking_date]
            .join(" ")
            .toLowerCase()
            .includes(q)
        );
      }
      rows.sort((a, b) => {
        const da = String(a.stocking_date);
        const db = String(b.stocking_date);
        if (da === db) return Number(b.id) - Number(a.id);
        return sortDir === "asc" ? da.localeCompare(db) : db.localeCompare(da);
      });
      return rows;
    }

    function showToast(msg, type = "success") {
      const el = document.getElementById("flash");
      if (!el) return;
      el.className = `alert alert-${type} py-2 small rounded-3 mb-3`;
      el.textContent = msg;
      el.classList.remove("d-none");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add("d-none"), 3500);
    }

    function updateCalcSummary() {
      const qty = document.getElementById("totalQuantity")?.value;
      const cost = document.getElementById("cost")?.value;
      const per = costPer1000(cost, qty);
      const perEl = document.getElementById("calcPer1000");
      const qtyEl = document.getElementById("calcQty");
      const costEl = document.getElementById("calcCost");
      if (perEl) perEl.textContent = money(per);
      if (qtyEl) qtyEl.textContent = qty ? Number(qty).toLocaleString() : "—";
      if (costEl) costEl.textContent = cost ? money(cost) : "—";
    }

    function resetForm() {
      editingId = null;
      const form = document.getElementById("seedForm");
      if (!form) return;
      form.reset();
      form.stocking_date.value = todayISO();
      if (ponds.length) form.pond_id.value = String(ponds[0].pond_id);
      document.getElementById("formTitle").innerHTML =
        '<i class="fa-solid fa-plus-circle me-1"></i> Add Seed Stocking Record';
      document.getElementById("saveBtn").innerHTML =
        '<i class="fa-solid fa-floppy-disk me-1"></i> Save Record';
      updateCalcSummary();
    }

    function fillForm(row) {
      editingId = row.id;
      const form = document.getElementById("seedForm");
      form.pond_id.value = String(row.pond_id);
      form.pl_stage.value = row.pl_stage;
      form.supplier_name.value = row.supplier_name;
      form.batch_number.value = row.batch_number;
      form.total_quantity.value = row.total_quantity;
      form.cost.value = Number(row.cost).toFixed(2);
      form.stocking_date.value = row.stocking_date;
      document.getElementById("formTitle").innerHTML =
        '<i class="fa-solid fa-pen-to-square me-1"></i> Edit Seed Stocking Record';
      document.getElementById("saveBtn").innerHTML =
        '<i class="fa-solid fa-floppy-disk me-1"></i> Update Record';
      updateCalcSummary();
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function exportCsv() {
      const rows = filteredItems();
      const headers = [
        "Stocking Date",
        "Pond Name",
        "PL Stage",
        "Supplier Name",
        "Batch Number",
        "Total Quantity",
        "Cost",
        "Cost per 1000 PL",
      ];
      const lines = [headers.join(",")];
      rows.forEach((r) => {
        lines.push(
          [
            r.stocking_date,
            `"${String(r.pond_name).replaceAll('"', '""')}"`,
            r.pl_stage,
            `"${String(r.supplier_name).replaceAll('"', '""')}"`,
            `"${String(r.batch_number).replaceAll('"', '""')}"`,
            r.total_quantity,
            Number(r.cost).toFixed(2),
            Number(r.cost_per_1000).toFixed(4),
          ].join(",")
        );
      });
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `seed-stocking-${todayISO()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderTable() {
      const rows = filteredItems();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      if (page > totalPages) page = totalPages;
      const start = (page - 1) * PAGE_SIZE;
      const pageRows = rows.slice(start, start + PAGE_SIZE);

      const tbody = document.getElementById("recordsBody");
      if (!tbody) return;
      tbody.innerHTML = pageRows.length
        ? pageRows
            .map(
              (r) => `
          <tr>
            <td>${escapeHtml(r.stocking_date)}</td>
            <td class="fw-bold text-primary">${escapeHtml(r.pond_name)}</td>
            <td><span class="badge bg-success-subtle text-success border border-success-subtle">${escapeHtml(r.pl_stage)}</span></td>
            <td>${escapeHtml(r.supplier_name)}</td>
            <td>${escapeHtml(r.batch_number)}</td>
            <td>${Number(r.total_quantity).toLocaleString()}</td>
            <td>${money(r.cost)}</td>
            <td class="text-nowrap">
              <button type="button" class="btn btn-sm btn-outline-primary me-1" data-action="view" data-id="${r.id}" title="View"><i class="fa-regular fa-eye"></i></button>
              <button type="button" class="btn btn-sm btn-outline-secondary me-1" data-action="edit" data-id="${r.id}" title="Edit"><i class="fa-solid fa-pen"></i></button>
              <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${r.id}" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`
            )
            .join("")
        : `<tr><td colspan="8" class="text-center text-muted py-3">No seed stocking records found.</td></tr>`;

      document.getElementById("pageInfo").textContent = `Page ${page} of ${totalPages} · ${rows.length} record(s)`;
      document.getElementById("prevPage").disabled = page <= 1;
      document.getElementById("nextPage").disabled = page >= totalPages;
    }

    function renderPage() {
      const pondOptions = ponds.length
        ? ponds
            .map((p) => `<option value="${p.pond_id}">${escapeHtml(p.name)}</option>`)
            .join("")
        : `<option value="">No ponds yet — add a pond first</option>`;
      const stageOptions = PL_STAGES.map(
        (s) => `<option value="${s}">${s}</option>`
      ).join("");

      mountAppShell(
        "seed",
        `
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-1">Seed Stocking</h4>
            <p class="text-muted small mb-0">Record PL stocking batches, cost, and suppliers</p>
          </div>
        </div>

        <div id="flash" class="d-none alert alert-success py-2 small rounded-3 mb-3"></div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="text-muted small fw-semibold">Total Stocking Records</div>
                  <h3 class="fw-bold mb-0 text-primary">${stats.total_records}</h3>
                </div>
                <div class="bg-primary-subtle text-primary p-3 rounded-circle fs-4"><i class="fa-solid fa-clipboard-list"></i></div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="text-muted small fw-semibold">Total PL Stocked</div>
                  <h3 class="fw-bold mb-0 text-success">${Number(stats.total_pl).toLocaleString()}</h3>
                </div>
                <div class="bg-success-subtle text-success p-3 rounded-circle fs-4"><i class="fa-solid fa-seedling"></i></div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="text-muted small fw-semibold">Total Stocking Cost</div>
                  <h3 class="fw-bold mb-0 text-danger">${money(stats.total_cost)}</h3>
                </div>
                <div class="bg-danger-subtle text-danger p-3 rounded-circle fs-4"><i class="fa-solid fa-indian-rupee-sign"></i></div>
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <div class="text-muted small fw-semibold">Most Recent Stocking</div>
                  <h3 class="fw-bold mb-0 text-info fs-5">${escapeHtml(stats.most_recent_date || "—")}</h3>
                </div>
                <div class="bg-info-subtle text-info p-3 rounded-circle fs-4"><i class="fa-regular fa-calendar-check"></i></div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3" id="formTitle"><i class="fa-solid fa-plus-circle me-1"></i> Add Seed Stocking Record</h6>
              <form id="seedForm">
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label small fw-semibold">Pond Name<span class="text-danger">*</span></label>
                    <select name="pond_id" class="form-select" required ${ponds.length ? "" : "disabled"}>${pondOptions}</select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label small fw-semibold">PL Stage<span class="text-danger">*</span></label>
                    <select name="pl_stage" class="form-select" required>${stageOptions}</select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label small fw-semibold">Supplier Name<span class="text-danger">*</span></label>
                    <input type="text" name="supplier_name" class="form-control" placeholder="e.g. Coastal Hatchery" required>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label small fw-semibold">Batch Number<span class="text-danger">*</span></label>
                    <input type="text" name="batch_number" class="form-control" placeholder="Unique per supplier" required>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-semibold">Total Quantity<span class="text-danger">*</span></label>
                    <input type="number" id="totalQuantity" name="total_quantity" class="form-control" min="1" step="1" placeholder="e.g. 50000" required>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-semibold">Cost (Rs.)<span class="text-danger">*</span></label>
                    <input type="number" id="cost" name="cost" class="form-control" min="0.01" step="0.01" placeholder="e.g. 25000.00" required>
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-semibold">Stocking Date<span class="text-danger">*</span></label>
                    <input type="date" name="stocking_date" class="form-control" value="${todayISO()}" required>
                  </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                  <button type="submit" id="saveBtn" class="btn btn-primary rounded-3" ${ponds.length ? "" : "disabled"}>
                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Record
                  </button>
                  <button type="button" id="resetBtn" class="btn btn-outline-secondary rounded-3">Reset Form</button>
                </div>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3 h-100">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-calculator me-1"></i> Auto Calculations</h6>
              <div class="list-group list-group-flush">
                <div class="list-group-item px-0 d-flex justify-content-between">
                  <span class="text-muted">Cost per 1000 PL</span>
                  <strong id="calcPer1000" class="text-primary">Rs.0.00</strong>
                </div>
                <div class="list-group-item px-0 d-flex justify-content-between">
                  <span class="text-muted">Total Quantity</span>
                  <strong id="calcQty">—</strong>
                </div>
                <div class="list-group-item px-0 d-flex justify-content-between">
                  <span class="text-muted">Total Cost</span>
                  <strong id="calcCost" class="text-danger">—</strong>
                </div>
              </div>
              <p class="small text-muted mt-3 mb-0">Formula: (Cost ÷ Total Quantity) × 1000</p>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h6 class="fw-bold text-primary mb-0"><i class="fa-solid fa-table me-1"></i> Seed Stocking Records</h6>
            <div class="d-flex flex-wrap gap-2">
              <input type="search" id="searchInput" class="form-control form-control-sm" style="min-width:180px" placeholder="Search..." value="${escapeHtml(searchQuery)}">
              <select id="sortSelect" class="form-select form-select-sm" style="width:auto">
                <option value="desc" ${sortDir === "desc" ? "selected" : ""}>Date: Newest</option>
                <option value="asc" ${sortDir === "asc" ? "selected" : ""}>Date: Oldest</option>
              </select>
              <button type="button" id="exportBtn" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-file-csv me-1"></i> Export CSV</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
              <thead class="table-light">
                <tr>
                  <th>Stocking Date</th>
                  <th>Pond Name</th>
                  <th>PL Stage</th>
                  <th>Supplier</th>
                  <th>Batch No.</th>
                  <th>Quantity</th>
                  <th>Cost</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="recordsBody"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
            <small class="text-muted" id="pageInfo"></small>
            <div class="btn-group">
              <button type="button" class="btn btn-sm btn-outline-primary" id="prevPage">Prev</button>
              <button type="button" class="btn btn-sm btn-outline-primary" id="nextPage">Next</button>
            </div>
          </div>
        </div>

        <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-3 border-0 shadow">
              <div class="modal-header">
                <h5 class="modal-title fw-bold text-primary">Stocking Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body small" id="viewBody"></div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>
      `
      );

      bindEvents();
      renderTable();
      updateCalcSummary();
    }

    function bindEvents() {
      document.getElementById("totalQuantity")?.addEventListener("input", updateCalcSummary);
      document.getElementById("cost")?.addEventListener("input", updateCalcSummary);
      document.getElementById("resetBtn")?.addEventListener("click", resetForm);
      document.getElementById("exportBtn")?.addEventListener("click", exportCsv);

      document.getElementById("searchInput")?.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        page = 1;
        renderTable();
      });
      document.getElementById("sortSelect")?.addEventListener("change", (e) => {
        sortDir = e.target.value;
        page = 1;
        renderTable();
      });
      document.getElementById("prevPage")?.addEventListener("click", () => {
        if (page > 1) {
          page -= 1;
          renderTable();
        }
      });
      document.getElementById("nextPage")?.addEventListener("click", () => {
        page += 1;
        renderTable();
      });

      document.getElementById("seedForm")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          pond_id: Number(fd.get("pond_id")),
          pl_stage: String(fd.get("pl_stage") || "").trim(),
          supplier_name: String(fd.get("supplier_name") || "").trim(),
          batch_number: String(fd.get("batch_number") || "").trim(),
          total_quantity: Number(fd.get("total_quantity")),
          cost: Number(fd.get("cost")),
          stocking_date: fd.get("stocking_date"),
        };

        if (!payload.pond_id) return showToast("Please select a pond.", "warning");
        if (!PL_STAGES.includes(payload.pl_stage)) return showToast("Please select a valid PL stage.", "warning");
        if (!payload.supplier_name) return showToast("Supplier name is required.", "warning");
        if (!payload.batch_number) return showToast("Batch number is required.", "warning");
        if (!Number.isInteger(payload.total_quantity) || payload.total_quantity <= 0) {
          return showToast("Total quantity must be a positive whole number.", "warning");
        }
        if (!(payload.cost > 0)) return showToast("Cost must be greater than 0.", "warning");

        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        try {
          if (editingId) {
            await API.put(`/api/seed-stocking/${editingId}`, payload);
            await refreshData(true);
            resetForm();
            showToast("Seed stocking record updated.");
          } else {
            await API.post("/api/seed-stocking", payload);
            await refreshData(true);
            resetForm();
            showToast("Seed stocking record saved.");
          }
        } catch (err) {
          showToast(err.message || "Save failed.", "danger");
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("recordsBody")?.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = Number(btn.dataset.id);
        const row = allItems.find((r) => r.id === id);
        if (!row) return;

        if (btn.dataset.action === "view") {
          document.getElementById("viewBody").innerHTML = `
            <dl class="row mb-0">
              <dt class="col-5 text-muted">Stocking Date</dt><dd class="col-7">${escapeHtml(row.stocking_date)}</dd>
              <dt class="col-5 text-muted">Pond</dt><dd class="col-7">${escapeHtml(row.pond_name)}</dd>
              <dt class="col-5 text-muted">PL Stage</dt><dd class="col-7">${escapeHtml(row.pl_stage)}</dd>
              <dt class="col-5 text-muted">Supplier</dt><dd class="col-7">${escapeHtml(row.supplier_name)}</dd>
              <dt class="col-5 text-muted">Batch Number</dt><dd class="col-7">${escapeHtml(row.batch_number)}</dd>
              <dt class="col-5 text-muted">Total Quantity</dt><dd class="col-7">${Number(row.total_quantity).toLocaleString()}</dd>
              <dt class="col-5 text-muted">Cost</dt><dd class="col-7">${money(row.cost)}</dd>
              <dt class="col-5 text-muted">Cost / 1000 PL</dt><dd class="col-7">${money(row.cost_per_1000)}</dd>
            </dl>`;
          const modal = new bootstrap.Modal(document.getElementById("viewModal"));
          modal.show();
        }

        if (btn.dataset.action === "edit") fillForm(row);

        if (btn.dataset.action === "delete") {
          if (!confirm("Delete this seed stocking record?")) return;
          try {
            await API.delete(`/api/seed-stocking/${id}`);
            await refreshData(true);
            showToast("Record deleted.");
          } catch (err) {
            showToast(err.message || "Delete failed.", "danger");
          }
        }
      });
    }

    async function refreshData(fullRender = true) {
      const [pondList, data] = await Promise.all([
        API.get("/api/ponds"),
        API.get("/api/seed-stocking"),
      ]);
      ponds = pondList;
      allItems = data.items || [];
      stats = {
        total_records: data.total_records || 0,
        total_pl: data.total_pl || 0,
        total_cost: data.total_cost || 0,
        most_recent_date: data.most_recent_date || null,
      };
      if (fullRender) renderPage();
      else renderTable();
    }

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      try {
        await refreshData(true);
      } catch (err) {
        mountAppShell(
          "seed",
          `<div class="alert alert-danger">${escapeHtml(err.message || "Failed to load seed stocking.")}</div>`
        );
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
