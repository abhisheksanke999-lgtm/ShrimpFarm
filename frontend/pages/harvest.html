<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Records - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;
      const [ponds, data] = await Promise.all([API.get("/api/ponds/names"), API.get("/api/harvests")]);
      const pondOptions = ponds.length
        ? ponds.map((p) => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("")
        : `<option value="">No ponds yet</option>`;
      const rows = data.items.length
        ? data.items.map((h) => `
            <tr>
              <td class="fw-bold text-primary">${escapeHtml(h.pond_name)}</td>
              <td>${escapeHtml(h.harvest_date)}</td>
              <td>${escapeHtml(h.quantity_kg)} kg</td>
              <td>Rs.${Number(h.price_per_kg).toFixed(2)}</td>
              <td>Rs.${Number(h.total_amount).toFixed(2)}</td>
              <td>${escapeHtml(h.buyer_name || "-")}</td>
            </tr>`).join("")
        : `<tr><td colspan="6" class="text-center text-muted py-3">No harvest records yet.</td></tr>`;

      mountAppShell("harvest", `
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-1">Harvest Records</h4>
            <p class="text-muted small mb-0">Record harvest weight, price, and buyer</p>
          </div>
          <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2">
            Revenue: Rs.${Number(data.total_revenue).toFixed(2)}
          </span>
        </div>
        <div class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Add Harvest</h6>
              <form id="harvestForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Pond</label>
                  <select name="pond_name" class="form-select" required>${pondOptions}</select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Date</label>
                  <input type="date" name="harvest_date" class="form-control" value="${todayISO()}" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Quantity (kg)</label>
                  <input type="number" step="0.1" name="quantity_kg" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Price per kg (Rs.)</label>
                  <input type="number" step="0.01" name="price_per_kg" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Buyer Name</label>
                  <input type="text" name="buyer_name" class="form-control">
                </div>
                <button class="btn btn-primary w-100 rounded-3" type="submit">Save Harvest</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3">All Harvest Records</h6>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                  <thead class="table-light">
                    <tr><th>Pond</th><th>Date</th><th>Qty</th><th>Price/kg</th><th>Total</th><th>Buyer</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById("harvestForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.post("/api/harvests", {
            pond_name: fd.get("pond_name"),
            harvest_date: fd.get("harvest_date"),
            quantity_kg: Number(fd.get("quantity_kg")),
            price_per_kg: Number(fd.get("price_per_kg")),
            buyer_name: fd.get("buyer_name") || "",
          });
          await loadPage({ type: "success", msg: res.message });
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>
</html>
