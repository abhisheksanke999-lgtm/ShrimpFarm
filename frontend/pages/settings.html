<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;

      mountAppShell("settings", `
        <div class="mb-4 pb-2 border-bottom">
          <h4 class="fw-bold mb-1">Settings</h4>
          <p class="text-muted small mb-0">Update your profile display name</p>
        </div>
        <div class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div class="row">
          <div class="col-12 col-lg-6">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3">Profile</h6>
              <form id="settingsForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Full Name</label>
                  <input type="text" name="full_name" class="form-control" value="${escapeHtml(user.full_name)}" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Email</label>
                  <input type="email" class="form-control bg-light" value="${escapeHtml(user.email)}" readonly>
                </div>
                <button type="submit" class="btn btn-primary rounded-3">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      `);

      document.getElementById("settingsForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.put("/api/settings/profile", { full_name: fd.get("full_name") });
          await loadPage({ type: "success", msg: res.message });
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>
</html>
