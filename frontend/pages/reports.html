<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      const r = await API.get("/api/reports");
      const profitClass = r.net_profit >= 0 ? "text-success" : "text-danger";

      mountAppShell("reports", `
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-1">Farm Reports</h4>
            <p class="text-muted small mb-0">Simple totals for ponds, feed, expenses, and profit</p>
          </div>
          <button class="btn btn-sm btn-outline-primary" onclick="window.print()">
            <i class="fa-solid fa-print me-1"></i> Print
          </button>
        </div>
        <div class="row g-3">
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="text-muted small fw-semibold">Total Ponds</div>
              <h3 class="fw-bold mb-0 text-primary">${r.total_ponds}</h3>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="text-muted small fw-semibold">Total Feed Used</div>
              <h3 class="fw-bold mb-0 text-success">${Number(r.total_feed_kg).toFixed(1)} kg</h3>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="text-muted small fw-semibold">Total Expenses</div>
              <h3 class="fw-bold mb-0 text-danger">Rs.${Number(r.total_expenses).toFixed(2)}</h3>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm rounded-3 p-3 bg-white">
              <div class="text-muted small fw-semibold">Harvest Revenue</div>
              <h3 class="fw-bold mb-0 text-info">Rs.${Number(r.total_revenue).toFixed(2)}</h3>
            </div>
          </div>
          <div class="col-12">
            <div class="card border-0 shadow-sm rounded-3 p-4 bg-white">
              <div class="text-muted small fw-semibold mb-1">Net Profit / Loss</div>
              <h2 class="fw-bold mb-0 ${profitClass}">Rs.${Number(r.net_profit).toFixed(2)}</h2>
              <p class="text-muted small mb-0 mt-2">Revenue − Expenses (your data only)</p>
            </div>
          </div>
        </div>
      `);
    })();
  </script>
</body>
</html>
