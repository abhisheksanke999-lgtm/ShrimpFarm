<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Observation - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;
      const [ponds, logs] = await Promise.all([API.get("/api/ponds/names"), API.get("/api/daily")]);
      const pondOptions = ponds.length
        ? ponds.map((p) => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("")
        : `<option value="">No ponds yet</option>`;
      const rows = logs.length
        ? logs.map((l) => `
            <tr>
              <td class="fw-bold text-primary">${escapeHtml(l.pond_name)}</td>
              <td>${escapeHtml(l.log_date)}</td>
              <td>${escapeHtml(l.temperature)}</td>
              <td>${escapeHtml(l.ph)}</td>
              <td>${escapeHtml(l.salinity)}</td>
              <td>${escapeHtml(l.dissolved_oxygen)}</td>
              <td>${escapeHtml(l.water_color)}</td>
              <td>${escapeHtml(l.mortality_count)}</td>
              <td>${escapeHtml(l.notes || "")}</td>
            </tr>`).join("")
        : `<tr><td colspan="9" class="text-center text-muted py-3">No daily logs yet.</td></tr>`;

      mountAppShell("daily", `
        <div class="mb-4 pb-2 border-bottom">
          <h4 class="fw-bold mb-1">Daily Observation</h4>
          <p class="text-muted small mb-0">Record water readings and shrimp health</p>
        </div>
        <div id="flash" class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div id="predictionBox" class="d-none mb-3">
    <div class="card border-0 shadow rounded-3">
        <div class="card-body">

            <h5 class="fw-bold text-primary mb-3">
                🦐 AI Disease Prediction
            </h5>

            <h4 id="riskLevel"></h4>

            <p class="mb-1">
                <strong>Confidence:</strong>
                <span id="confidence"></span>%
            </p>

            <hr>

            <h6>Recommendations</h6>

            <ul id="recommendations"></ul>

        </div>
    </div>
</div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Add Daily Log</h6>
              <form id="dailyForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Pond <span class="text-danger">*</span></label>
                  <select name="pond_name" class="form-select" required>${pondOptions}</select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Date<span class="text-danger">*</span></label>
                  <input type="date" name="log_date" class="form-control" value="${todayISO()}" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Temperature (°C)<span class="text-danger">*</span></label>
                  <input type="number" step="0.1" name="temperature" placeholder="e.g. 29" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">pH<span class="text-danger">*</span></label>
                  <input type="number" step="0.1" name="ph" placeholder="e.g. 7.9" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Salinity (ppt)<span class="text-danger">*</span></label>
                  <input type="number" step="0.1" name="salinity" placeholder="e.g. 22" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Dissolved Oxygen (mg/L)<span class="text-danger">*</span></label>
                  <input type="number" step="0.1" name="dissolved_oxygen" placeholder="e.g. 6" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Water Color<span class="text-danger">*</span></label>
                  <select name="water_color" class="form-select" required>
                    <option value="Light Green">Light Green</option>
                    <option value="Dark Green">Dark Green</option>
                    <option value="Goldiesh brown">Goldiesh brown</option>
                    <option value="No Color">No Color</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Mortality Count</label>
                  <input type="number" name="mortality_count" class="form-control" value="0">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Notes</label>
                  <input type="text" name="notes" class="form-control">
                </div>
                <button class="btn btn-primary w-100 rounded-3" type="submit">Save Log</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3">All Daily Logs</h6>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                  <thead class="table-light">
                    <tr><th>Pond</th><th>Date</th><th>Temp</th><th>pH</th><th>Salinity</th><th>DO</th><th>Color</th><th>Mortality</th><th>Notes</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById("dailyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.post("/api/daily", {
    pond_name: fd.get("pond_name"),
    log_date: fd.get("log_date"),
    temperature: Number(fd.get("temperature") || 0),
    ph: Number(fd.get("ph") || 0),
    salinity: Number(fd.get("salinity") || 0),
    dissolved_oxygen: Number(fd.get("dissolved_oxygen") || 0),
    water_color: fd.get("water_color"),
    mortality_count: Number(fd.get("mortality_count") || 0),
    notes: fd.get("notes") || "",
});

// Success message
document.getElementById("flash").className =
    "alert alert-success py-2 small rounded-3 mb-3";
document.getElementById("flash").innerHTML = res.message;
document.getElementById("flash").classList.remove("d-none");

// Show prediction card
document.getElementById("predictionBox").classList.remove("d-none");

// Risk
const risk = res.prediction.disease_risk;
const riskElement = document.getElementById("riskLevel");

if (risk === "Healthy") {
    riskElement.innerHTML = "🟢 Healthy";
    riskElement.className = "text-success fw-bold";
}
else if (risk === "Moderate") {
    riskElement.innerHTML = "🟡 Moderate";
    riskElement.className = "text-warning fw-bold";
}
else {
    riskElement.innerHTML = "🔴 High Risk";
    riskElement.className = "text-danger fw-bold";
}

// Confidence
document.getElementById("confidence").innerHTML =
    res.prediction.confidence;

// Recommendations
document.getElementById("recommendations").innerHTML =
    res.prediction.recommendations
        .map(r => `<li>${r}</li>`)
        .join("");

// Reset form
e.target.reset();
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>

</html>
