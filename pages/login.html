<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shrimp Farm Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/modules.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-shrimp"></i>
        </div>
        <h3 class="fw-bold text-primary mb-1">AquaControl SaaS</h3>
        <p class="text-muted small">Shrimp Farm Record Management System</p>
      </div>

      <form action="dashboard.html" method="GET">
        <div class="form-floating-custom mb-3">
          <input type="email" id="loginEmail" placeholder=" " required value="farmer@shrimpfarm.com">
          <label for="loginEmail"><i class="fa-regular fa-envelope me-2"></i>Email Address</label>
        </div>

        <div class="form-floating-custom mb-3" style="position: relative;">
          <input type="password" id="loginPass" placeholder=" " required value="password123">
          <label for="loginPass"><i class="fa-solid fa-lock me-2"></i>Password</label>
          <button type="button" class="btn btn-sm text-muted position-absolute end-0 top-50 translate-middle-y me-2" onclick="togglePassVisibility('loginPass', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember Me</label>
          </div>
          <a href="forgot-password.html" class="small fw-semibold text-primary">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary-saas w-100 py-2.5 mb-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to Dashboard
        </button>
      </form>

      <div class="divider-with-text">
        <span>OR CONTINUE WITH</span>
      </div>

      <div class="d-flex gap-2 mb-4">
        <button type="button" class="social-login-btn">
          <i class="fa-brands fa-google text-danger"></i> Google
        </button>
        <button type="button" class="social-login-btn">
          <i class="fa-brands fa-apple text-dark"></i> Apple ID
        </button>
      </div>

      <div class="text-center small text-muted">
        Don't have an account? <a href="register.html" class="fw-semibold text-primary">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }
  </script>
</body>
</html>
