<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponds - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;
      const ponds = await API.get("/api/ponds");
      const rows = ponds.length
        ? ponds.map((p) => `
            <tr>
              <td>#${p.pond_id}</td>
              <td class="fw-bold text-primary">${escapeHtml(p.name)}</td>
              <td>${escapeHtml(p.area_sqm)} acres</td>
              <td>${escapeHtml(p.depth_m)} feets</td>
              <td>${escapeHtml(p.water_source)}</td>
              <td><span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">${escapeHtml(p.status)}</span></td>
            </tr>`).join("")
        : `<tr><td colspan="6" class="text-center text-muted py-3">No ponds yet. Add one using the form.</td></tr>`;

      mountAppShell("pond", `
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
          <div>
            <h4 class="fw-bold mb-1">Pond Management</h4>
            <p class="text-muted small mb-0">View your ponds or add a new one</p>
          </div>
        </div>
        <div id="flash" class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Add New Pond</h6>
              <form id="pondForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Pond Name / ID</label>
                  <input type="text" name="name" class="form-control" placeholder="e.g. Pond Alpha (01)" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Area (Acres)</label>
                  <input type="number" step="0.01" name="area_sqm" class="form-control" placeholder="e.g. 2" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Depth (feets)</label>
                  <input type="number" step="0.01" name="depth_m" class="form-control" placeholder="e.g. 6" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Water Source</label>
                  <select name="water_source" class="form-select">
                    <option value="Borewell">Borewell</option>
                    <option value="Loose water">Loose water</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Status</label>
                  <select name="status" class="form-select">
                    <option value="Active">Active</option>
                    <option value="Preparation">Preparation</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Harvested">Harvested</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-3">Save Pond</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-water me-1"></i> All Ponds</h6>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                  <thead class="table-light">
                    <tr><th>#ID</th><th>Pond Name</th><th>Area (Acres)</th><th>Depth (feet)</th><th>Water Source</th><th>Status</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById("pondForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.post("/api/ponds", {
            name: fd.get("name"),
            area_sqm: Number(fd.get("area_sqm")),
            depth_m: Number(fd.get("depth_m")),
            water_source: fd.get("water_source"),
            status: fd.get("status"),
          });
          await loadPage({ type: "success", msg: res.message });
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>
</html>
