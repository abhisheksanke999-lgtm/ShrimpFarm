<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Shrimp Farm Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/modules.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-lock-open"></i>
        </div>
        <h3 class="fw-bold text-primary mb-1">Reset Password</h3>
        <p class="text-muted small">Enter your new secure password below</p>
      </div>

      <form action="login.html" method="GET">
        <div class="form-floating-custom mb-3">
          <input type="password" id="newPass" placeholder=" " required>
          <label for="newPass"><i class="fa-solid fa-lock me-2"></i>New Password</label>
        </div>

        <div class="form-floating-custom mb-4">
          <input type="password" id="confirmPass" placeholder=" " required>
          <label for="confirmPass"><i class="fa-solid fa-lock me-2"></i>Confirm New Password</label>
        </div>

        <button type="submit" class="btn btn-primary-saas w-100 py-2.5 mb-3">
          <i class="fa-solid fa-rotate me-2"></i>Update Password & Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
