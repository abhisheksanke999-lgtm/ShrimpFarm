<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Records - AquaControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main">
  <div id="app"></div>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    async function loadPage(flash) {
      const user = await requireAuth();
      if (!user) return;
      const [ponds, records] = await Promise.all([API.get("/api/ponds/names"), API.get("/api/feed")]);
      const pondOptions = ponds.length
        ? ponds.map((p) => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join("")
        : `<option value="">No ponds yet</option>`;
      const rows = records.length
        ? records.map((r) => `
            <tr>
              <td class="fw-bold text-primary">${escapeHtml(r.pond_name)}</td>
              <td>${escapeHtml(r.entry_date)}</td>
              <td>${escapeHtml(r.feed_brand)}</td>
              <td>${escapeHtml(r.quantity_kg)} kg</td>
              <td>${escapeHtml(r.feed_size || "-")}</td>
              <td>${escapeHtml(r.feeding_time || "-")}</td>
            </tr>`).join("")
        : `<tr><td colspan="6" class="text-center text-muted py-3">No feed records yet.</td></tr>`;

      mountAppShell("feed", `
        <div class="mb-4 pb-2 border-bottom">
          <h4 class="fw-bold mb-1">Feed Records</h4>
          <p class="text-muted small mb-0">Log how much feed was given to each pond</p>
        </div>
        <div class="${flash ? "" : "d-none"} alert alert-${flash?.type || "success"} py-2 small rounded-3 mb-3">${flash ? escapeHtml(flash.msg) : ""}</div>
        <div class="row g-4">
          <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-plus-circle me-1"></i> Add Feed Record</h6>
              <form id="feedForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Pond</label>
                  <select name="pond_name" class="form-select" required>${pondOptions}</select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Date</label>
                  <input type="date" name="entry_date" class="form-control" value="${todayISO()}" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Feed Brand</label>
                  <input type="text" name="feed_brand" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Quantity (kg)</label>
                  <input type="number" step="0.1" name="quantity_kg" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Feed Size</label>
                  <input type="text" name="feed_size" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Feeding Time</label>
                  <select name="feeding_time" class="form-select">
                    <option value="feed 1">feed 1</option>
                    <option value="feed 2">feed 2</option>
                    <option value="feed 3">feed 3</option>
                    <option value="feed 4">feed 4</option>
                    <option value="Morning">Morning</option>
                  </select>
                </div>
                <button class="btn btn-primary w-100 rounded-3" type="submit">Save Feed</button>
              </form>
            </div>
          </div>
          <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-3">
              <h6 class="fw-bold text-primary mb-3">All Feed Records</h6>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                  <thead class="table-light">
                    <tr><th>Pond</th><th>Date</th><th>Brand</th><th>Qty</th><th>Size</th><th>Time</th></tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById("feedForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await API.post("/api/feed", {
            pond_name: fd.get("pond_name"),
            feed_brand: fd.get("feed_brand"),
            quantity_kg: Number(fd.get("quantity_kg")),
            feeding_time: fd.get("feeding_time"),
            entry_date: fd.get("entry_date"),
            feed_size: fd.get("feed_size") || "",
          });
          await loadPage({ type: "success", msg: res.message });
        } catch (err) {
          await loadPage({ type: "danger", msg: err.message });
        }
      });
    }
    loadPage();
  </script>
</body>
</html>
