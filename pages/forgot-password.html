<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Shrimp Farm Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/modules.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 class="fw-bold text-primary mb-1">Forgot Password?</h3>
        <p class="text-muted small">Enter your email to receive a 6-digit OTP code</p>
      </div>

      <form action="otp-verification.html" method="GET">
        <div class="form-floating-custom mb-4">
          <input type="email" id="forgotEmail" placeholder=" " required value="farmer@shrimpfarm.com">
          <label for="forgotEmail"><i class="fa-regular fa-envelope me-2"></i>Email Address</label>
        </div>

        <button type="submit" class="btn btn-primary-saas w-100 py-2.5 mb-3">
          <i class="fa-solid fa-paper-plane me-2"></i>Send Verification Code
        </button>
      </form>

      <div class="text-center small text-muted">
        Remembered password? <a href="login.html" class="fw-semibold text-primary">Back to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
