<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification - Shrimp Farm Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/modules.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h3 class="fw-bold text-primary mb-1">Enter Verification Code</h3>
        <p class="text-muted small">We sent a 6-digit OTP code to farmer@shrimpfarm.com</p>
      </div>

      <form action="reset-password.html" method="GET">
        <div class="d-flex justify-content-between gap-2 mb-4">
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="8" required>
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="4" required>
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="2" required>
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="9" required>
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="1" required>
          <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold shadow-sm" style="height: 54px;" value="6" required>
        </div>

        <button type="submit" class="btn btn-primary-saas w-100 py-2.5 mb-3">
          <i class="fa-solid fa-check-double me-2"></i>Verify OTP & Continue
        </button>
      </form>

      <div class="text-center small text-muted">
        Didn't receive code? <a href="#" class="fw-semibold text-primary">Resend OTP (45s)</a>
      </div>
    </div>
  </div>
</body>
</html>
